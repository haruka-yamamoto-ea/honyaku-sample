<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>価格表記の翻訳除外テスト</title>
</head>
<body>
  <h1 data-stt-ignore>価格表記の翻訳除外テスト</h1>

  <h2 data-stt-ignore>波ダッシュ（U+301C）：そのまま表示されること</h2>
  <p>￥33,600〜</p>

  <h2 data-stt-ignore>全角チルダ（U+FF5E）：そのまま表示されること</h2>
  <p>￥33,600～</p>

  <h2 data-stt-ignore>日本語を含む表記：翻訳されること</h2>
  <p>33,600円〜</p>
</body>
</html>
