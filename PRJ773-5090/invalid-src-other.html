<body>
  <h1>別形式の不正src</h1>
  <p>不正なIPv6形式でもページ生成が継続することを確認します。</p>

  <h2>不正src・正常srcset</h2>
  <img id="invalid-other"
       src="http://["

       alt="不正srcの画像"
       width="240" height="100">

  <h2>後続の正常画像</h2>

       src="/honyaku-sample/PRJ773-5090/sample.svg"
       alt="後続の正常画像"
       width="240" height="100">
