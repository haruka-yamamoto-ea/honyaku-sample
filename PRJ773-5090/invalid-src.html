<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>不正srcの確認</title>
  <!-- 導入タグ -->
  <script src="https://yamamoto-ea-shutto-translation.s3.amazonaws.com/trans.js?id=592"></script>
</head>
<body>
  <h1>不正src</h1>

  <h2>不正src画像</h2>
  <img id="following"
       src="https://haruka-yamamoto-ea.github.iodata:image/png;base64,AAAA"
       alt="後続の不正画像" width="240" height="100">
  
  <h2>不正src・正常srcset</h2>
  <img id="invalid-src"
       src="https://haruka-yamamoto-ea.github.iodata:image/png;base64,AAAA"
       srcset="/honyaku-sample/PRJ773-5090/sample.svg 1x"
       alt="不正srcの画像" width="240" height="100">

  <h2>後続の正常画像</h2>
  <img id="following"
       src="/honyaku-sample/PRJ773-5090/sample.svg"
       alt="後続の正常画像" width="240" height="100">
</body>
</html>
