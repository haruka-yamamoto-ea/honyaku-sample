<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>正常画像のURL形式確認</title>
  <!-- 導入タグ -->
  <script src="https://yamamoto-ea-shutto-translation.s3.amazonaws.com/trans.js?id=592"></script>
</head>
<body>
  <h1>正常画像のURL形式</h1>
  <p>5形式の画像が表示され、画像書き換え警告が出ないことを確認します。</p>

  <h2>1. Data URI</h2>
  <img id="data-uri"
       src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22240%22%20height%3D%22100%22%3E%3Crect%20width%3D%22240%22%20height%3D%22100%22%20fill%3D%22%23087f5b%22%2F%3E%3C%2Fsvg%3E"
       alt="Data URIの緑色画像"
       width="240" height="100">

  <h2>2. 相対URL</h2>
  <img id="relative"
       src="./sample.svg"
       alt="相対URLの画像"
       width="240" height="100">

  <h2>3. 元ホストURL</h2>
  <img id="original-host"
       src="https://haruka-yamamoto-ea.github.io/honyaku-sample/PRJ773-5090/sample.svg"
       alt="元ホストURLの画像"
       width="240" height="100">

  <h2>4. hostingホストURL</h2>
  <img id="hosting-host"
       src="https://en-592.site.trans.test/honyaku-sample/PRJ773-5090/sample.svg"
       alt="hostingホストURLの画像"
       width="240" height="100">

  <h2>5. 外部ホストURL</h2>
  <img id="external-host"
       src="https://www.w3.org/Icons/w3c_home.png"
       alt="外部ホストの画像">
</body>
</html>
