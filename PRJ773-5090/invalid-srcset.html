<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>不正srcsetの確認</title>
</head>
<body>
  <h1>不正srcset</h1>

  <h2>正常src・不正候補を含むsrcset</h2>
  <img id="invalid-srcset"
       src="/honyaku-sample/sample.svg"
       srcset="/honyaku-sample/sample.svg 1x, http://[ 2x"
       alt="不正srcsetの画像" width="240" height="100">

  <h2>後続の正常画像</h2>
  <img id="following"
       src="/honyaku-sample/sample.svg"
       alt="後続の正常画像" width="240" height="100">
</body>
</html>
